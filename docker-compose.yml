services:
  salario-service:
    image: guilhermejr/sistema-salario-service
    container_name: salario-service
    restart: always
    env_file: /home/guilhermejr/secrets/salario-service.env
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:9009:9009"

networks:
  default:
    external: true
    name: rede
